
{% extends 'base.html' %}

{% block title %}My Wishlist | BanniThinonna{% endblock %}

{% block content %}

<style>
.wishlist-page {
    max-width: 1100px;
    margin: 50px auto;
    padding: 20px;
    min-height: 55vh;
}

.wishlist-heading {
    text-align: center;
    margin-bottom: 40px;
}

.wishlist-heading h1 {
    font-size: 36px;
    color: #5b3025;
}

.wishlist-heading p {
    color: #777;
    margin-top: 8px;
}

.empty-wishlist {
    background: white;
    text-align: center;
    padding: 65px 20px;
    border-radius: 14px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.07);
}

.heart-icon {
    font-size: 65px;
}

.empty-wishlist h2 {
    color: #5b3025;
    margin: 15px 0;
}

.empty-wishlist p {
    color: #777;
    margin-bottom: 25px;
}

.shop-btn {
    display: inline-block;
    background: #8b4935;
    color: white;
    padding: 13px 25px;
    border-radius: 7px;
    text-decoration: none;
}

.wishlist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.wishlist-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    transition: 0.3s;
}

.wishlist-card:hover {
    transform: translateY(-4px);
}

.wishlist-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 9px;
}

.wishlist-card h3 {
    color: #5b3025;
    margin: 12px 0 7px;
}

.wishlist-price {
    color: #8b4935;
    font-weight: bold;
    margin-bottom: 12px;
}

.wishlist-weight {
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

.wishlist-actions {
    display: flex;
    gap: 8px;
}

.wishlist-actions button {
    flex: 1;
    padding: 10px 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.add-cart {
    background: #8b4935;
    color: white;
}

.add-cart:hover {
    background: #70432f;
}

.remove-item {
    background: #f3e8e5;
    color: #743b2c;
}

.remove-item:hover {
    background: #ead4cc;
}

@media(max-width: 600px) {
    .wishlist-heading h1 {
        font-size: 28px;
    }
}
@media(max-width: 900px) {
    .cakes-grid {
        grid-template-columns: 1fr;
    }
}
</style>


<div class="wishlist-page">

    <div class="wishlist-heading">
        <h1>My Wishlist ♡</h1>
        <p>All the treats you love, saved in one place!</p>
    </div>


    <!-- WISHLIST PRODUCTS -->

    <div class="wishlist-grid" id="wishlistGrid"></div>


    <!-- EMPTY WISHLIST -->

    <div class="empty-wishlist" id="emptyWishlist" style="display:none;">

        <div class="heart-icon">♡</div>

        <h2>Your wishlist is empty!</h2>

        <p>Save your favourite cakes, sweets and snacks here.</p>

        <a href="{% url 'sweets' %}" class="shop-btn">
            Explore Sweets
        </a>

    </div>

</div>


<script>

// GET WISHLIST

function getWishlist() {

    try {
        return JSON.parse(
            localStorage.getItem("bakeryWishlist")
        ) || [];
    } catch (error) {
        return [];
    }

}


// SAVE WISHLIST

function saveWishlist(wishlist) {

    localStorage.setItem(
        "bakeryWishlist",
        JSON.stringify(wishlist)
    );

}


// DISPLAY WISHLIST

function displayWishlist() {

    let wishlist = getWishlist();

    let grid = document.getElementById("wishlistGrid");
    let empty = document.getElementById("emptyWishlist");

    grid.innerHTML = "";

    if (wishlist.length === 0) {

        empty.style.display = "block";

    } else {

        empty.style.display = "none";

        wishlist.forEach((item, index) => {

            let card = document.createElement("div");
            card.className = "wishlist-card";

            let image = document.createElement("img");
            image.src = item.image || "";
            image.alt = item.name || "Product";

            image.onerror = function() {
                this.style.display = "none";
            };

            let name = document.createElement("h3");
            name.textContent = item.name || "Product";

            let price = document.createElement("p");
            price.className = "wishlist-price";
            price.textContent =
                "₹" + (Number(item.price) || 0).toFixed(2);

            let weight = document.createElement("p");
            weight.className = "wishlist-weight";

            let grams = Number(item.weight) || 1000;

            weight.textContent =
                "Weight: " + (grams >= 1000
                    ? (grams / 1000) + " kg"
                    : grams + " g");

            let actions = document.createElement("div");
            actions.className = "wishlist-actions";

            let addButton = document.createElement("button");
            addButton.className = "add-cart";
            addButton.textContent = "Add to Cart";
            addButton.type = "button";
            addButton.onclick = () => moveToCart(index);

            let removeButton = document.createElement("button");
            removeButton.className = "remove-item";
            removeButton.textContent = "Remove";
            removeButton.type = "button";
            removeButton.onclick = () => removeWishlistItem(index);

            actions.append(addButton, removeButton);

            card.append(image, name, price, weight, actions);

            grid.appendChild(card);

        });

    }

    updateHeaderCounts();

}


// REMOVE FROM WISHLIST

function removeWishlistItem(index) {

    let wishlist = getWishlist();

    wishlist.splice(index, 1);

    saveWishlist(wishlist);

    displayWishlist();

}


// MOVE WISHLIST PRODUCT TO CART

function moveToCart(index) {

    let wishlist = getWishlist();

    let product = wishlist[index];

    if (!product) return;

    let cart = [];

    try {
        cart = JSON.parse(
            localStorage.getItem("bakeryCart")
        ) || [];
    } catch (error) {
        cart = [];
    }

    let existing = cart.find(item =>
        String(item.id) === String(product.id) &&
        Number(item.weight || 1000) === Number(product.weight || 1000)
    );

    if (existing) {

        existing.quantity = (Number(existing.quantity) || 1) + 1;

    } else {

        cart.push({
            ...product,
            weight: Number(product.weight) || 1000,
            quantity: 1
        });

    }

    localStorage.setItem(
        "bakeryCart",
        JSON.stringify(cart)
    );

    wishlist.splice(index, 1);

    saveWishlist(wishlist);

    displayWishlist();

    alert(product.name + " moved to cart!");

}


// HEADER COUNTS

function updateHeaderCounts() {

    let cart = [];

    try {
        cart = JSON.parse(
            localStorage.getItem("bakeryCart")
        ) || [];
    } catch (error) {
        cart = [];
    }

    let cartCount = cart.reduce(
        (total, item) => total + (Number(item.quantity) || 1), 0
    );

    let wishlistCount = getWishlist().length;

    let cartElement = document.getElementById("cartCount");
    let wishlistElement = document.getElementById("wishlistCount");

    if (cartElement) cartElement.textContent = cartCount;

    if (wishlistElement) wishlistElement.textContent = wishlistCount;

}


// INITIAL DISPLAY

document.addEventListener("DOMContentLoaded", displayWishlist);

</script>

{% endblock %}
